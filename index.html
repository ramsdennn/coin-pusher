<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coin Pusher Quiz</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #0B0616; color: #EDE7FA;
    font-family: Arial, Helvetica, sans-serif;
  }
  #game { width: 100vw; height: 100dvh; }
  /* Stop a tap on the machine scrolling or zooming the page on a phone. */
  #game canvas { display: block; touch-action: none; }

  #setup {
    position: fixed; inset: 0; z-index: 50;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 26px; background: radial-gradient(circle at 50% 35%, #241141 0%, #0B0616 70%);
  }
  #setup h1 {
    margin: 0; font-size: min(58px, 13vw); letter-spacing: 2px; font-weight: 900;
    color: #C77DFF; text-shadow: 0 0 28px rgba(199,125,255,.45);
  }
  #setup p { margin: 0; color: #7E6BA8; font-size: 19px; }
  .row { display: flex; gap: 22px; flex-wrap: wrap; justify-content: center; }
  .row input {
    width: min(300px, 80vw); padding: 16px 18px; font-size: 24px; font-weight: bold;
    border-radius: 10px; border: 3px solid #3B2A5E;
    background: #150C28; color: #fff; text-align: center;
  }
  .row input:focus { outline: none; border-color: #C77DFF; }
  #start {
    padding: 18px 60px; font-size: 26px; font-weight: 900; letter-spacing: 1px;
    border: none; border-radius: 10px; cursor: pointer;
    background: #C77DFF; color: #12081F;
  }
  #start:hover { background: #DDA5FF; }
  #fs { color: #5C4A85; font-size: 15px; }
</style>
</head>
<body>

<div id="setup">
  <h1>COIN PUSHER</h1>
  <p>Type the two team names, then start the session.</p>
  <div class="row">
    <input id="teamA" placeholder="Team 1" autocomplete="off">
    <input id="teamB" placeholder="Team 2" autocomplete="off">
  </div>
  <button id="start">START</button>
  <div id="fs">Press F11 for full screen. Scores and shelf reset every time this page is reloaded.</div>
</div>

<div id="game"></div>

<script>
  /* Every file under src/ is loaded with a cache-buster on the end. Without it
     the browser happily serves you a stale copy, so you edit config.js, reload,
     and none of your changes appear. This already cost a real debugging detour
     once - do not drop it.

     The awkward part is that a static import inside a module cannot carry a
     stamp, so the stamp goes in an import map instead, which is built here and
     injected before anything else loads. Modules then import each other by
     name ('@app/machine') and the map decides which stamped URL that means.
     Three.js and Rapier never change, so they stay cached normally. */
  const startBtn = document.getElementById('start');
  const setup    = document.getElementById('setup');
  const stamp    = Date.now();

  const importMap = document.createElement('script');
  importMap.type = 'importmap';
  importMap.textContent = JSON.stringify({
    imports: {
      'three':        './vendor/three/three.module.js',
      'rapier':       './vendor/rapier/rapier.mjs',
      '@app/dims':    './src/dims.js?v=' + stamp,
      '@app/machine': './src/machine.js?v=' + stamp,
      '@app/items':   './src/items.js?v=' + stamp,
      '@app/audio':   './src/audio.js?v=' + stamp,
      '@app/game':    './src/game.js?v=' + stamp
    }
  });
  document.head.appendChild(importMap);

  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const el = document.createElement('script');
      el.src = src + '?v=' + stamp;
      el.onload = resolve;
      el.onerror = () => reject(new Error('Could not load ' + src));
      document.head.appendChild(el);
    });
  }

  startBtn.disabled = true;
  startBtn.textContent = 'LOADING...';

  /* ------------------------------------------------------------------
     MEASUREMENT HARNESS (dev only, does nothing unless you ask for it)

     ?cfg={"physics":{"lengthUnit":1.0}}   deep-merges JSON into the config
                                           AFTER config.js loads, so an A/B
                                           is one URL rather than an edit,
                                           a save and a hand-reload.
     ?auto=1                               skips the team-name screen.

     Both exist because comparing two settings honestly needs the same pile,
     the same warm-up and the same number of steps on each side, and doing
     that by hand is how you end up comparing a cold first run against a warm
     second one and believing the difference.
     ------------------------------------------------------------------ */
  const QS = new URLSearchParams(location.search);

  function deepMerge(target, patch) {
    for (const k of Object.keys(patch)) {
      const v = patch[k];
      if (v && typeof v === 'object' && !Array.isArray(v) &&
          target[k] && typeof target[k] === 'object' && !Array.isArray(target[k])) {
        deepMerge(target[k], v);
      } else {
        target[k] = v;
      }
    }
    return target;
  }

  function applyOverrides() {
    const raw = QS.get('cfg');
    if (!raw) return;
    const patch = JSON.parse(raw);
    deepMerge(window.COIN_PUSHER_CONFIG, patch);
    window.COIN_PUSHER_OVERRIDES = patch;
    console.log('[cfg] overrides applied:', patch);
  }

  loadScript('src/config.js')
    .then(applyOverrides)
    .then(() => import('@app/game'))
    .then(() => {
      startBtn.disabled = false; startBtn.textContent = 'START';
      if (QS.has('auto')) begin();
    })
    .catch(err => {
      startBtn.textContent = 'FAILED TO LOAD';
      document.getElementById('fs').textContent =
        err.message + ' - check the file exists and that you opened this through a server, not as a file.';
      console.error(err);
    });

  function begin() {
    if (startBtn.disabled) return;
    const a = document.getElementById('teamA').value.trim() || 'Team 1';
    const b = document.getElementById('teamB').value.trim() || 'Team 2';
    setup.remove();
    window.startCoinPusher(a, b);
  }
  startBtn.addEventListener('click', begin);
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && document.body.contains(setup)) begin();
  });
</script>
</body>
</html>
