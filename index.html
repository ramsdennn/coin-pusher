<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coin Pusher Quiz</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #000; color: #EDE7FA;
    font-family: Arial, Helvetica, sans-serif;
  }
  #game { width: 100vw; height: 100dvh; }
  /* Stop a tap on the machine scrolling or zooming the page on a phone. */
  #game canvas { display: block; touch-action: none; }

  /* ----------------------------------------------------------------------
     THE TITLE SCREEN

     Everything on it is the game's own furniture rather than a second set of
     styles: the logo is the file the game hangs top-right, and the two name
     fields and the START button are the score panels' chrome, built by
     tools/build-scoreboard.py at the proportions of a text box.

     PANEL         SVG        rendered      screen inset
     name field    480x107    300x67px      2.92% x, 13.08% y
     START         360x107    225x67px      3.89% x, 13.08% y

     Both panels are 107 tall with a 14 bezel, so rendered at the same 67px
     height their frames come out exactly as thick as each other. The padding
     below is those insets in pixels - it keeps the text off the metal and
     inside the lit screen, which is where the game puts its own.
     ---------------------------------------------------------------------- */
  #setup {
    position: fixed; inset: 0; z-index: 50;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 26px; background: #000;
  }

  /* The logo is 2:1, so bounding it on BOTH axes is what stops a short window
     pushing the START button off the bottom. Same trick as the right-hand
     column in the game - see rightColumn in config.js. */
  #title { display: block; width: min(560px, 78vw, 64vh); height: auto; }

  #setup p, #fs {
    margin: 0; color: #fff; font-weight: bold; font-style: italic;
  }
  #setup p { font-size: 19px; }
  #fs       { font-size: 15px; }

  .row { display: flex; gap: 22px; flex-wrap: wrap; justify-content: center; }

  /* The panel art carries the frame, so the input has no border of its own -
     one drawn over the top would sit outside the bevel and read as a box
     round a box. */
  .row input, #start {
    box-sizing: border-box; height: 67px; border: none; border-radius: 0;
    background-repeat: no-repeat; background-position: center;
    background-size: 100% 100%;
    font-family: 'Arial Narrow','Haettenschweiler','Arial Bold',Arial,Helvetica,sans-serif;
    font-weight: bold; color: #fff; text-align: center; line-height: 1;
    /* Shadow first, then glow: text-shadow paints back to front, so the glow
       has to come second or the shadow sits on top of it. Same order and the
       same two colours as the scoreboards. */
    text-shadow: 0 2px 1.5px rgba(4,7,14,.72), 0 0 4px rgba(190,220,255,.5);
  }

  .row input {
    width: min(300px, 80vw); padding: 9px 10px;
    font-size: 24px; font-style: italic;
  }
  #teamA { background-image: url('assets/scoreboard/title-name-a.svg'); }
  #teamB { background-image: url('assets/scoreboard/title-name-b.svg'); }

  /* Placeholders at full white would read as names already typed in. Holding
     them back to 55% keeps them obviously a prompt while still reading as
     white rather than as a second colour. */
  .row input::placeholder { color: #fff; opacity: .55; font-style: italic; }
  .row input:focus {
    outline: none;
    filter: drop-shadow(0 0 7px rgba(255,255,255,.65));
  }

  #start {
    width: 225px; padding: 9px 14px;
    font-size: 26px; letter-spacing: 0.06em; cursor: pointer;
    background-image: url('assets/scoreboard/title-start.svg');
  }
  #start:hover:not(:disabled) { filter: brightness(1.14); }
  #start:disabled { filter: brightness(.55); cursor: default; }
</style>
</head>
<body>

<div id="setup">
  <img id="title" src="assets/logo/tipping-point.svg" alt="Tipping Point">
  <p>Type the two team names, then find out where your Tipping Point is!</p>
  <div class="row">
    <input id="teamA" placeholder="Team 1" autocomplete="off">
    <input id="teamB" placeholder="Team 2" autocomplete="off">
  </div>
  <button id="start">START</button>
  <div id="fs">Press F11 for full screen.</div>
</div>

<div id="game"></div>

<script>
  /* Every file under src/ is loaded with a cache-buster on the end. Without it
     the browser happily serves you a stale copy, so you edit config.js, reload,
     and none of your changes appear. This already cost a real debugging detour
     once - do not drop it.

     The awkward part is that a static import inside a module cannot carry a
     stamp, so the stamp goes in an import map instead, which is built here and
     injected before anything else loads. Modules then import each other by
     name ('@app/machine') and the map decides which stamped URL that means.
     Three.js and Rapier never change, so they stay cached normally. */
  const startBtn = document.getElementById('start');
  const setup    = document.getElementById('setup');
  const stamp    = Date.now();

  const importMap = document.createElement('script');
  importMap.type = 'importmap';
  importMap.textContent = JSON.stringify({
    imports: {
      'three':        './vendor/three/three.module.js',
      'rapier':       './vendor/rapier/rapier.mjs',
      '@app/dims':    './src/dims.js?v=' + stamp,
      '@app/machine': './src/machine.js?v=' + stamp,
      '@app/items':   './src/items.js?v=' + stamp,
      '@app/audio':   './src/audio.js?v=' + stamp,
      '@app/game':    './src/game.js?v=' + stamp
    }
  });
  document.head.appendChild(importMap);

  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const el = document.createElement('script');
      el.src = src + '?v=' + stamp;
      el.onload = resolve;
      el.onerror = () => reject(new Error('Could not load ' + src));
      document.head.appendChild(el);
    });
  }

  startBtn.disabled = true;
  startBtn.textContent = 'LOADING...';

  /* ------------------------------------------------------------------
     MEASUREMENT HARNESS (dev only, does nothing unless you ask for it)

     ?cfg={"physics":{"lengthUnit":1.0}}   deep-merges JSON into the config
                                           AFTER config.js loads, so an A/B
                                           is one URL rather than an edit,
                                           a save and a hand-reload.
     ?auto=1                               skips the team-name screen.

     Both exist because comparing two settings honestly needs the same pile,
     the same warm-up and the same number of steps on each side, and doing
     that by hand is how you end up comparing a cold first run against a warm
     second one and believing the difference.
     ------------------------------------------------------------------ */
  const QS = new URLSearchParams(location.search);

  function deepMerge(target, patch) {
    for (const k of Object.keys(patch)) {
      const v = patch[k];
      if (v && typeof v === 'object' && !Array.isArray(v) &&
          target[k] && typeof target[k] === 'object' && !Array.isArray(target[k])) {
        deepMerge(target[k], v);
      } else {
        target[k] = v;
      }
    }
    return target;
  }

  function applyOverrides() {
    const raw = QS.get('cfg');
    if (!raw) return;
    const patch = JSON.parse(raw);
    deepMerge(window.COIN_PUSHER_CONFIG, patch);
    window.COIN_PUSHER_OVERRIDES = patch;
    console.log('[cfg] overrides applied:', patch);
  }

  loadScript('src/config.js')
    .then(applyOverrides)
    .then(() => import('@app/game'))
    .then(() => {
      startBtn.disabled = false; startBtn.textContent = 'START';
      if (QS.has('auto')) begin();
    })
    .catch(err => {
      startBtn.textContent = 'FAILED TO LOAD';
      document.getElementById('fs').textContent =
        err.message + ' - check the file exists and that you opened this through a server, not as a file.';
      console.error(err);
    });

  function begin() {
    if (startBtn.disabled) return;
    const a = document.getElementById('teamA').value.trim() || 'Team 1';
    const b = document.getElementById('teamB').value.trim() || 'Team 2';
    setup.remove();
    window.startCoinPusher(a, b);
  }
  startBtn.addEventListener('click', begin);
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && document.body.contains(setup)) begin();
  });
</script>
</body>
</html>
